# Dependabot (Phase 11): atualizações semanais, com teto de PRs abertos para
# não afogar a revisão. O lockfile do pnpm é mantido pelo próprio Dependabot.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      # Patches e minors de dev tooling entram juntos; runtime fica separado
      # para ser revisado um a um.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
