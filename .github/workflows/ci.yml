name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio (Phase 11): o workflow só lê o repositório. Nenhum job
# precisa escrever em conteúdo, PRs, issues ou pacotes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safecircle
          POSTGRES_PASSWORD: safecircle
          POSTGRES_DB: safecircle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safecircle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://safecircle:safecircle@localhost:5432/safecircle

    # Actions fixadas por SHA do commit (Phase 11): uma tag pode ser movida,
    # um SHA não. O comentário registra a versão correspondente para revisão.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria de dependências (high/critical)
        run: pnpm security:audit

      - name: Aplicar migrations (banco limpo)
        run: pnpm --filter @safecircle/api db:migrate

      - name: Validação (lint + format + typecheck + testes + build)
        run: pnpm validate

      - name: Verificar conectividade com o banco (Drizzle + PostgreSQL)
        run: pnpm db:check
